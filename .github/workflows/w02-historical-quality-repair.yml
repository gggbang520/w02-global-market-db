name: W02 Historical Quality Repair

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Repair range start date"
        required: true
        default: "2024-01-01"
      end_date:
        description: "Repair range end date"
        required: true
        default: "2026-09-27"
      batch_size:
        description: "Yahoo ticker batch size"
        required: true
        default: "40"
      sleep_seconds:
        description: "Seconds between Yahoo batches"
        required: true
        default: "1.5"

permissions:
  contents: write

concurrency:
  group: w02-historical-quality-repair
  cancel-in-progress: false

jobs:
  quality-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout W02
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Repair non-PASS historical quarters
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/automation/backfill_historical_yahoo.py             --start "${{ inputs.start_date }}"             --end "${{ inputs.end_date }}"             --batch-size "${{ inputs.batch_size }}"             --sleep "${{ inputs.sleep_seconds }}"
