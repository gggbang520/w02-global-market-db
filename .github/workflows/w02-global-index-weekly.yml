name: W02 Global Index Weekly

on:
  push:
    paths:
      - "data/history/DATA-2026-W39/indices/price_daily__*"
      - "data/standardized/index_master.json"
      - "scripts/automation/build_global_index_weekly.py"
      - "tests/test_global_index_weekly.py"
      - ".github/workflows/w02-global-index-weekly.yml"
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Weekly layer start date"
        required: true
        default: "2019-01-01"
      end_date:
        description: "Weekly layer end date"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: w02-global-index-weekly
  cancel-in-progress: false

jobs:
  build-index-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout W02
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt
      - name: Build global index weekly layer
        run: |
          START_DATE="${{ inputs.start_date || '2019-01-01' }}"
          END_DATE="${{ inputs.end_date }}"
          if [ -z "$END_DATE" ]; then END_DATE="$(date -u +%F)"; fi
          python scripts/automation/build_global_index_weekly.py \
            --start "$START_DATE" \
            --end "$END_DATE"
      - name: Run weekly layer tests
        run: |
          python -m pytest -q tests/test_global_index_weekly.py
      - name: Commit weekly layer
        run: |
          git config user.name "W02 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/DATA-2026-W39/indices/index_weekly__* \
            data/standardized/partitions/SRC-DERIVED-INDEX-WEEKLY \
            reports/index/global_index_weekly_state.json
          if git diff --cached --quiet; then
            echo "No weekly layer changes to commit."
            exit 0
          fi
          git commit -m "data: build global index weekly layer"
          git push
