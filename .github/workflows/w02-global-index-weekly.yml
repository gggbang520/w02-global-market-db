name: W02 Global Index Weekly

on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Weekly derivation start date"
        required: false
        default: "2019-01-01"
      end_date:
        description: "Weekly derivation end date (UTC)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: w02-global-index-weekly
  cancel-in-progress: false

jobs:
  build-index-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout W02
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Build global index weekly layer
        run: |
          START_DATE="${{ inputs.start_date || '2019-01-01' }}"
          END_DATE="${{ inputs.end_date }}"
          if [ -z "$END_DATE" ]; then END_DATE="$(date -u +%F)"; fi
          python scripts/automation/build_global_index_weekly.py \
            --start "$START_DATE" \
            --end "$END_DATE"

      - name: Commit weekly derived data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standardized/partitions/SRC-DERIVED-INDEX-WEEKLY reports/index/global_index_weekly_state.json data/history
          if git diff --cached --quiet; then
            echo "No weekly changes to commit"
          else
            git commit -m "data: update global index weekly layer"
            git push
          fi
