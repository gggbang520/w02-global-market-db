name: W02 Historical Backfill 2021-2026

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date"
        required: true
        default: "2021-01-30"
      end_date:
        description: "Historical end date"
        required: true
        default: "2026-09-27"
      batch_size:
        description: "Yahoo ticker batch size"
        required: true
        default: "40"
      sleep_seconds:
        description: "Seconds between Yahoo batches"
        required: true
        default: "1.5"

permissions:
  contents: write

concurrency:
  group: w02-historical-backfill
  cancel-in-progress: false

jobs:
  historical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout W02
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Historical backfill with checkpoints
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/automation/backfill_historical_yahoo.py \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --sleep "${{ inputs.sleep_seconds }}"
