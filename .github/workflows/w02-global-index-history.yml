name: W02 Global Index History

on:
  push:
    paths:
      - "data/standardized/index_master.json"
      - "scripts/automation/fetch_global_index_history.py"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date"
        required: true
        default: "2019-01-01"
      end_date:
        description: "Historical end date"
        required: true
        default: "2026-09-29"

permissions:
  contents: write

concurrency:
  group: w02-global-index-history
  cancel-in-progress: false

jobs:
  fetch-index-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout W02
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt
      - name: Fetch global index history
        run: |
          python scripts/automation/fetch_global_index_history.py \
            --start "${{ inputs.start_date || '2019-01-01' }}" \
            --end "${{ inputs.end_date || '2026-09-29' }}"
