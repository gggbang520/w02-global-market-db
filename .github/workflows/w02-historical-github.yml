name: W02 Historical Expansion

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date"
        required: true
        default: "2021-01-18"
      end_date:
        description: "Historical end date"
        required: true
        default: "2021-01-29"

permissions:
  contents: write

jobs:
  historical-expansion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout W02
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install automation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Fetch historical archive
        run: |
          cd scripts/automation
          python fetch_github_archive.py             --start "${{ inputs.start_date }}"             --end "${{ inputs.end_date }}"

      - name: Run W02 pipeline
        run: python scripts/run_pipeline.py

      - name: Run tests
        run: python -m pytest -q

      - name: Commit historical data
        run: |
          git config user.name "W02 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ MANIFEST.sha256.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No historical data/report changes to commit."
            exit 0
          fi
          git commit -m "data: expand W02 historical archive"
          git push
