name: W02 Storage Compaction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout W02
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compact standardized row files
        run: python scripts/compact_standardized.py

      - name: Commit compacted standardized data
        run: |
          git config user.name "W02 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standardized/partitions/ data/standardized/stocks/ reports/quality/standardized_compaction.json
          git add -A data/standardized/stocks/ 2>/dev/null || true
          git commit -m "refactor: compact standardized market history storage"
          git push
