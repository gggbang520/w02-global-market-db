name: W02 Provenance Repair V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout W02
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild canonical provenance partitions
        run: python scripts/repair_provenance_v2.py

      - name: Commit canonical provenance partitions
        run: |
          git config user.name "W02 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standardized/partitions/ reports/quality/provenance_repair_v2.json
          git commit -m "fix: rebuild canonical automated market provenance partitions"
          git push
