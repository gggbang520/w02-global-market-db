name: W02 Global Index Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "40 2 * * 1-5"

permissions:
  contents: write

jobs:
  build-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout W02
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build global index performance
        run: python scripts/automation/build_global_index_performance.py

      - name: Commit performance report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/index/global_index_performance.json
          git diff --cached --quiet || git commit -m "data: update global index performance"
          git push
