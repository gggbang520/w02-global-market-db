name: W02 Global Index Snapshot

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - W02 Global Index Weekly
    types:
      - completed

permissions:
  contents: write

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout W02
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build global index snapshot
        run: python scripts/automation/build_global_index_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/index/latest_index_snapshot.json
          git diff --cached --quiet || git commit -m "data: update global index snapshot"
          git push
