name: W02 Weekly Market Data

on:
  push:
    paths:
      - "scripts/automation/build_global_index_weekly.py"
      - "tests/test_global_index_weekly.py"
      - "data/standardized/index_master.json"
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

jobs:
  weekly-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout W02
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install automation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-automation.txt

      - name: Fetch latest A-share daily prices
        run: |
          cd scripts/automation
          python fetch_yfinance_cn.py --days 14 --batch-size 40 --sleep 1.5

      - name: Build global index weekly layer
        run: |
          START_DATE="2019-01-01"
          END_DATE="$(date -u +%F)"
          python scripts/automation/build_global_index_weekly.py \
            --start "$START_DATE" \
            --end "$END_DATE"

      - name: Validate CSI300 baseline
        run: python scripts/validate/validate_csi300.py

      - name: Run W02 weekly tests
        run: python -m pytest -q tests/test_global_index_weekly.py

      - name: Commit W02 data
        run: |
          git config user.name "W02 Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ MANIFEST.sha256.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data/report changes to commit."
            exit 0
          fi
          git commit -m "data: weekly W02 market update"
          git push
