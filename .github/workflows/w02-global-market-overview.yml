name: W02 Global Market Overview

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - W02 Regional Market Strength
    types:
      - completed

permissions:
  contents: write

jobs:
  build-overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build overview
        run: python scripts/automation/build_global_market_overview.py

      - name: Sync frontend data
        run: python scripts/automation/sync_dashboard_to_frontend.py

      - name: Verify frontend data output
        run: test -f frontend/public/data/global_market_overview.json

      - name: Commit report and frontend data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/dashboard/global_market_overview.json frontend/public/data/global_market_overview.json
          git commit -m "data: update global market overview frontend data" || echo "No changes"
          git push
